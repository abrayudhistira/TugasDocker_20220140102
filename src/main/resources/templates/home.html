<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home - Data Mahasiswa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #111 100%);
            padding: 2rem;
            font-family: sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2rem;
            max-width: 860px;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .glass-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .glass-title {
            font-size: 22px;
            font-weight: 500;
            color: #fff;
        }

        .glass-title span {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            display: block;
            margin-top: 3px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: sans-serif;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .btn-danger {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-danger:hover {
            background: rgba(255, 50, 50, 0.25);
            color: #fff;
            border-color: rgba(255, 100, 100, 0.3);
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0 0 1.5rem;
        }

        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 7px 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        .stat-pill b {
            color: #fff;
            font-weight: 500;
        }

        .glass-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead tr {
            background: rgba(255, 255, 255, 0.08);
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 13px 16px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
        }

        .id-cell {
            color: rgba(255, 255, 255, 0.25);
            font-size: 12px;
        }

        .nim-code {
            font-family: monospace;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-laki {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .badge-perempuan {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty-row td {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="glass-header">
            <div class="glass-title">
                Data Mahasiswa
                <span>Sistem Informasi Akademik</span>
            </div>
            <div class="btn-group">
                <a href="/create" class="btn btn-primary">+ Tambah Data</a>
                <a href="/logout" class="btn btn-danger">Logout</a>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-pill">Total mahasiswa: <b th:text="${#lists.size(users)}">0</b></div>
            <div class="stat-pill">Laki-laki: <b th:text="${#lists.size(users.?[gender == 'Laki-laki'])}">0</b></div>
            <div class="stat-pill">Perempuan: <b th:text="${#lists.size(users.?[gender == 'Perempuan'])}">0</b></div>
        </div>

        <hr class="divider">

        <div class="glass-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Gender</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td class="id-cell" th:text="${user.id}"></td>
                        <td th:text="${user.nama}"></td>
                        <td><span class="nim-code" th:text="${user.nim}"></span></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${user.gender == 'Laki-laki'} ? 'badge-laki' : 'badge-perempuan'"
                                  th:text="${user.gender}">
                            </span>
                        </td>
                    </tr>
                    <tr class="empty-row" th:if="${#lists.isEmpty(users)}">
                        <td colspan="4">Belum ada data.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
